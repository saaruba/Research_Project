<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>O-space labelling</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#1e1e1e;color:#eee;
      display:flex;flex-direction:column;height:100vh}
 header{padding:10px 16px;background:#252526;border-bottom:1px solid #3c3c3c}
 h1{font-size:15px;margin:0 0 6px}
 #bar{height:6px;background:#3c3c3c;border-radius:3px;overflow:hidden}
 #fill{height:100%;background:#0a84ff;width:0%;transition:width .2s}
 #meta{font-size:13px;margin-top:6px;color:#bbb}
 #wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;
       overflow:auto;position:relative}
 #stage{position:relative;line-height:0}
 img{max-width:100%;max-height:72vh;cursor:crosshair;border:2px solid #3c3c3c}
 #mark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;
       pointer-events:none;display:none}
 #mark:before,#mark:after{content:"";position:absolute;background:#00ff66}
 #mark:before{left:11px;top:0;width:4px;height:26px}
 #mark:after{top:11px;left:0;height:4px;width:26px}
 footer{padding:10px 16px;background:#252526;border-top:1px solid #3c3c3c;
        display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 button{background:#0e639c;color:#fff;border:0;padding:8px 14px;border-radius:4px;
        font-size:14px;cursor:pointer}
 button:hover{background:#1177bb}
 button.alt{background:#4a4a4a}
 button.go{background:#16825d}
 #status{margin-left:auto;font-size:13px;color:#bbb}
 kbd{background:#3c3c3c;border-radius:3px;padding:1px 6px;font-size:12px}
</style></head><body>
<header>
  <h1>O-space labelling &mdash; click the empty centre of the conversation</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="meta"></div>
</header>
<div id="wrap"><div id="stage"><img id="img" alt=""><div id="mark"></div></div></div>
<footer>
  <button class="alt" onclick="back()">&larr; Back <kbd>B</kbd></button>
  <button class="alt" onclick="noGroup()">No group <kbd>N</kbd></button>
  <button class="alt" onclick="skip()">Skip <kbd>S</kbd></button>
  <button class="go" onclick="download()">Download labels.csv</button>
  <span id="status"></span>
</footer>
<script>
const FRAMES = [{"f": "frame_000_s1.jpg", "s": "1", "n": "4"}, {"f": "frame_001_s1.jpg", "s": "1", "n": "3"}, {"f": "frame_002_s10.jpg", "s": "10", "n": "2"}, {"f": "frame_003_s12.jpg", "s": "12", "n": "5"}, {"f": "frame_004_s12.jpg", "s": "12", "n": "3"}, {"f": "frame_005_s14.jpg", "s": "14", "n": "2"}, {"f": "frame_006_s14.jpg", "s": "14", "n": "2"}, {"f": "frame_007_s26.jpg", "s": "26", "n": "2"}, {"f": "frame_008_s27.jpg", "s": "27", "n": "2"}, {"f": "frame_009_s3.jpg", "s": "3", "n": "2"}, {"f": "frame_010_s3.jpg", "s": "3", "n": "6"}, {"f": "frame_011_s30.jpg", "s": "30", "n": "2"}, {"f": "frame_012_s31.jpg", "s": "31", "n": "2"}, {"f": "frame_013_s31.jpg", "s": "31", "n": "3"}, {"f": "frame_014_s5.jpg", "s": "5", "n": "3"}, {"f": "frame_015_s5.jpg", "s": "5", "n": "2"}, {"f": "frame_016_s51.jpg", "s": "51", "n": "3"}, {"f": "frame_017_s51.jpg", "s": "51", "n": "2"}, {"f": "frame_018_s51.jpg", "s": "51", "n": "3"}, {"f": "frame_019_s52.jpg", "s": "52", "n": "3"}, {"f": "frame_020_s54.jpg", "s": "54", "n": "2"}, {"f": "frame_021_s55.jpg", "s": "55", "n": "2"}, {"f": "frame_022_s60.jpg", "s": "60", "n": "4"}, {"f": "frame_023_s60.jpg", "s": "60", "n": "2"}, {"f": "frame_024_s7.jpg", "s": "7", "n": "2"}, {"f": "frame_025_s7.jpg", "s": "7", "n": "3"}, {"f": "frame_026_s8.jpg", "s": "8", "n": "3"}, {"f": "frame_027_s9.jpg", "s": "9", "n": "2"}, {"f": "frame_028_s9.jpg", "s": "9", "n": "2"}, {"f": "frame_029_s9.jpg", "s": "9", "n": "2"}];
const DIR = "dataset/processed/ospace_labelling/clean/";
const KEY = "ospace_labels_v1";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = FRAMES.findIndex(fr => !(fr.f in labels));
if (i < 0) i = 0;

const img = document.getElementById("img"), mark = document.getElementById("mark");

function show(){
  const fr = FRAMES[i];
  img.src = DIR + fr.f;
  const done = Object.keys(labels).length;
  document.getElementById("fill").style.width = (done/FRAMES.length*100)+"%";
  document.getElementById("meta").textContent =
    `[${i+1}/${FRAMES.length}]  ${fr.f}  —  session ${fr.s}, ${fr.n} detected`;
  const L = labels[fr.f];
  document.getElementById("status").textContent =
    `${done}/${FRAMES.length} labelled` + (L ? `  •  this one: ${L.x==="none"?"NO GROUP":"("+L.x+", "+L.y+")"}` : "");
  mark.style.display = "none";
  if (L && L.x !== "none") img.onload = place;
  else img.onload = null;
}
function place(){
  const L = labels[FRAMES[i].f]; if(!L || L.x==="none") return;
  mark.style.left = (L.x / img.naturalWidth  * img.clientWidth ) + "px";
  mark.style.top  = (L.y / img.naturalHeight * img.clientHeight) + "px";
  mark.style.display = "block";
}
img.addEventListener("click", e => {
  const r = img.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width  * img.naturalWidth);
  const y = Math.round((e.clientY - r.top ) / r.height * img.naturalHeight);
  labels[FRAMES[i].f] = {x, y};
  save(); next();
});
function noGroup(){ labels[FRAMES[i].f] = {x:"none", y:"none"}; save(); next(); }
function skip(){ next(); }
function back(){ i = Math.max(0, i-1); show(); }
function next(){ if(i+1 < FRAMES.length) i++; show(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(labels)); }
function download(){
  let out = "frame_file,label_x,label_y\n";
  FRAMES.forEach(fr => {
    const L = labels[fr.f];
    out += fr.f + "," + (L ? L.x : "") + "," + (L ? L.y : "") + "\n";
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"text/csv"}));
  a.download = "ospace_clicks.csv"; a.click();
}
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if(k==="n") noGroup(); else if(k==="b") back(); else if(k==="s") skip();
});
show();
</script></body></html>
